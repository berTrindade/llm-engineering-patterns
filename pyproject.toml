[project]
name = "context-window-poc"
version = "0.1.0"
description = "Token counting and history-trimming strategies for long support ticket threads"
readme = "README.md"
authors = [
    { name = "Bernardo T. Abreu", email = "btrindadedeabreu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
